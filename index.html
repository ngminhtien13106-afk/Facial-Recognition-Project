<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
  <link rel="stylesheet" href="main.css">
</head>

<body style="margin: 0;">
  <div>
    <!-- Title -->
    <div class="div_title">
      <div class="div_text">
        <p class="text_title">Facial Recognition Project </p>
      </div>
      <p class="text_title1">HotLine: 1992000</p>
    </div>
    <!--Sub-content-->
    <div class="div_sub_content">
      <!-- img -->
      <div class="div_img">
        <img class="img"
          src="./img/qv-vq-letter-logos-2-300f25f7cd710093990f9bdae67ee5c08f999a62872a6d409e3db884dc4fe104-removebg-preview.png"
          alt="">
      </div>
      <!-- content -->
      <!-- content1 -->
      <div class="div_content1">
        <p class="content">Hello everyone, and welcome to the Face Recognition Project.</p>
      </div>
      <!-- content2 -->
      <div class="div_content2">
        <div class="div_content2_img">
          <img class="content2_img"
            src="./img/pngtree-check-list-mark-icon-checklist-png-image_8337268-removebg-preview.png" alt="">
        </div>
        <p class="content2_p">list of member names</p>
        <!-- content3 -->

      </div>

    </div>
    <!-- content Facial Recognition -->

    <div class="div_head">
      <div class="div_button">
        <button>Open Img</button>
      </div>
      <div class="div_head_img">

        <img class="head_img"
          src="./img/1786676809865_6100391018288862636_g150778198604200979_2a434f68c1a88135c8ab8b976bc103b8.jpg" alt="">
        <div class="person person-1" data-person="person-1"></div>
        <div class="person person-2" data-person="person-2"></div>
        <div class="person person-3" data-person="person-3"></div>
        <div class="person person-4" data-person="person-4"></div>
        <div class="person person-5" data-person="person-5"></div>
        <div class="person person-6" data-person="person-6"></div>
        <div class="person person-7" data-person="person-7"></div>
        <div class="person person-8" data-person="person-8"></div>
        <div class="person person-9" data-person="person-9"></div>

      </div>
    </div>
    <div class="div_content3 div_head_list">
      <ul class="content3_ul head_list_ul">

      </ul>

    </div>
    <!-- bottom -->
    <div class="div_buttons">
      <button class="buttons"> Cancel </button>
    </div>

    <div class="div_information">
      <div class="div_input">
        <label>Id: </label>
        <input class="input input-1" type="text" placeholder="enter your id">
      </div>
      <div class="div_input">
        <label for="">Name: </label>
        <input class="input input-2" type="text" placeholder="enter your name ">
      </div>
      <div class="div_input">
        <label for="">age: </label>
        <input class="input input-3" type="text" placeholder="enter your age">

      </div>
      <div class="div_input">
        <label for="">address: </label>
        <input class="input input-4" type="text" placeholder="enter your address">

      </div>
      <div style="display: flex;">
        <div>
          <button class="cancel">Cancel</button>
        </div>
        <div>
          <button class="btn-add">Add</button>
        </div>
        <div>
          <button class="btn-put">Updata</button>
        </div>
        <div>
          <button class="btn-delete">Delete</button>
        </div>
      </div>
    </div>
    <div style="background-color: aliceblue;">
      <p style="font-size: 15px; text-align: center; margin: 0; padding: 4px;">Bắt đầu hành trình của riêng bạn ngay hôm
        nay --Version
        1.1.1.1@</p>
    </div>
  </div>


  <script src="./main.js"></script>
</body>

</html>
